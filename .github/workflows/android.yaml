name: Compilação Automatizada do SamPlayer

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixando o código fonte do repositório
      uses: actions/checkout@v5 # Atualizado para v5 (compatível com Node 24)

    - name: Configurando o Java JDK necessário para Android
      uses: actions/setup-java@v5 # Migrado para v5 conforme exigido pelo GitHub
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Garantindo permissão de execução para o Gradle
      run: chmod +x gradlew

    - name: Compilando o APK de Teste (Debug)
      run: ./gradlew assembleDebug

    - name: Disponibilizando o APK final para download
      uses: actions/upload-artifact@v4
      with:
        name: SamPlayer-APK-Otimizado
        path: app/build/outputs/apk/debug/*.apk
